<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Working Illustration</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
        }
        
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Animation for floating cards */
        @keyframes float-card-1 {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes float-card-2 {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        @keyframes float-card-3 {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-18px); }
        }

        /* Animation for screen/monitor */
        @keyframes pulse-screen {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        /* Animation for person typing */
        @keyframes typing-hand {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        .card-1 { animation: float-card-1 3s ease-in-out infinite; }
        .card-2 { animation: float-card-2 3.5s ease-in-out infinite; }
        .card-3 { animation: float-card-3 3.2s ease-in-out infinite; }
        .monitor { animation: pulse-screen 2s ease-in-out infinite; }
        .typing { animation: typing-hand 0.6s ease-in-out infinite; }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
        <!-- Background shapes -->
        <circle cx="100" cy="100" r="80" fill="#E8F4F8" opacity="0.3"/>
        <circle cx="700" cy="500" r="100" fill="#C8E6D4" opacity="0.2"/>

        <!-- Person 1 - Left (Manager) -->
        <g>
            <!-- Body -->
            <rect x="80" y="280" width="60" height="120" rx="20" fill="#5B4B8A"/>
            <!-- Head -->
            <circle cx="110" cy="250" r="25" fill="#D4A574"/>
            <!-- Arms -->
            <rect x="50" y="300" width="30" height="15" rx="7" fill="#D4A574" transform="rotate(-20 65 307)"/>
            <rect x="140" y="300" width="30" height="15" rx="7" fill="#D4A574" transform="rotate(20 155 307)"/>
            <!-- Legs -->
            <rect x="90" y="400" width="15" height="60" rx="7" fill="#3B2E5C"/>
            <rect x="105" y="400" width="15" height="60" rx="7" fill="#3B2E5C"/>
        </g>

        <!-- Person 2 - Center (Developer at screen) -->
        <g>
            <!-- Chair -->
            <rect x="360" y="380" width="80" height="15" rx="7" fill="#8B7BA8"/>
            <rect x="385" y="395" width="30" height="80" rx="5" fill="#A899C0" opacity="0.7"/>
            
            <!-- Body -->
            <rect x="360" y="260" width="75" height="130" rx="20" fill="#6B5B95"/>
            <!-- Head -->
            <circle cx="397" cy="225" r="28" fill="#D4A574"/>
            <!-- Left arm (typing) -->
            <g class="typing">
                <rect x="330" y="280" width="35" height="18" rx="8" fill="#D4A574"/>
                <rect x="320" y="295" width="15" height="40" rx="7" fill="#D4A574"/>
            </g>
            <!-- Right arm -->
            <rect x="435" y="280" width="35" height="18" rx="8" fill="#D4A574"/>
        </g>

        <!-- Person 3 - Right (Designer/Tester) -->
        <g>
            <!-- Body -->
            <rect x="600" y="290" width="65" height="125" rx="20" fill="#8B6BA0"/>
            <!-- Head -->
            <circle cx="632" cy="255" r="27" fill="#D4A574"/>
            <!-- Arms pointing at screen -->
            <rect x="570" y="310" width="35" height="16" rx="8" fill="#D4A574" transform="rotate(-35 587 318)"/>
            <rect x="665" y="310" width="35" height="16" rx="8" fill="#D4A574" transform="rotate(35 682 318)"/>
            <!-- Legs -->
            <rect x="610" y="415" width="14" height="65" rx="7" fill="#5B4B7A"/>
            <rect x="626" y="415" width="14" height="65" rx="7" fill="#5B4B7A"/>
        </g>

        <!-- Monitor/Screen (Center) -->
        <g class="monitor">
            <defs>
                <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#5B8DEE;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#3B5BCC;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <!-- Screen Frame -->
            <rect x="350" y="120" width="200" height="140" rx="8" fill="url(#screenGradient)" stroke="#2B4B9C" stroke-width="3"/>
            
            <!-- Screen Content - Lines -->
            <rect x="365" y="135" width="170" height="8" rx="3" fill="#E8F4F8" opacity="0.9"/>
            <rect x="365" y="150" width="140" height="6" rx="2" fill="#E8F4F8" opacity="0.8"/>
            <rect x="365" y="162" width="150" height="6" rx="2" fill="#E8F4F8" opacity="0.8"/>
            <rect x="365" y="174" width="130" height="6" rx="2" fill="#E8F4F8" opacity="0.7"/>
            
            <!-- Window icons -->
            <circle cx="500" cy="200" r="8" fill="#00D9FF" opacity="0.9"/>
            <rect x="515" y="193" width="15" height="14" rx="2" fill="#00D9FF" opacity="0.8"/>
            <rect x="535" y="193" width="15" height="14" rx="2" fill="#1B6E3A" opacity="0.8"/>
            
            <!-- Bezel -->
            <rect x="345" y="260" width="210" height="25" rx="5" fill="#4B7BCC"/>
            <circle cx="450" cy="272" r="5" fill="#3B6BBB"/>
        </g>

        <!-- Floating Cards -->
        <!-- Card 1 -->
        <g class="card-1">
            <rect x="250" y="180" width="70" height="85" rx="6" fill="#FFB6C1" stroke="#FF69B4" stroke-width="2" opacity="0.9"/>
            <rect x="260" y="195" width="50" height="4" rx="2" fill="#FF69B4" opacity="0.6"/>
            <rect x="260" y="205" width="45" height="3" rx="1" fill="#FF69B4" opacity="0.5"/>
            <rect x="260" y="213" width="50" height="4" rx="2" fill="#FF69B4" opacity="0.6"/>
            <circle cx="285" cy="235" r="15" fill="#FF69B4" opacity="0.7"/>
        </g>

        <!-- Card 2 -->
        <g class="card-2">
            <rect x="520" y="150" width="70" height="85" rx="6" fill="#FFD4A3" stroke="#FF9500" stroke-width="2" opacity="0.9"/>
            <rect x="530" y="165" width="50" height="4" rx="2" fill="#FF9500" opacity="0.6"/>
            <rect x="530" y="175" width="45" height="3" rx="1" fill="#FF9500" opacity="0.5"/>
            <rect x="530" y="183" width="50" height="4" rx="2" fill="#FF9500" opacity="0.6"/>
            <rect x="535" y="205" width="35" height="20" rx="3" fill="#FF9500" opacity="0.7"/>
        </g>

        <!-- Card 3 -->
        <g class="card-3">
            <rect x="680" y="200" width="70" height="85" rx="6" fill="#B3E5FC" stroke="#00B8D4" stroke-width="2" opacity="0.9"/>
            <rect x="690" y="215" width="50" height="4" rx="2" fill="#00B8D4" opacity="0.6"/>
            <rect x="690" y="225" width="45" height="3" rx="1" fill="#00B8D4" opacity="0.5"/>
            <rect x="690" y="233" width="50" height="4" rx="2" fill="#00B8D4" opacity="0.6"/>
            <circle cx="715" cy="255" r="12" fill="#00B8D4" opacity="0.7"/>
        </g>

        <!-- Decorative elements (sparkles/status indicators) -->
        <circle cx="280" cy="100" r="4" fill="#1B6E3A" opacity="0.6"/>
        <circle cx="300" cy="85" r="3" fill="#00D9FF" opacity="0.5"/>
        <circle cx="320" cy="105" r="3.5" fill="#FF69B4" opacity="0.5"/>
        
        <circle cx="550" cy="90" r="3" fill="#1B6E3A" opacity="0.6"/>
        <circle cx="570" cy="75" r="4" fill="#00D9FF" opacity="0.5"/>
        <circle cx="540" cy="70" r="3" fill="#FF9500" opacity="0.5"/>
    </svg>
</body>
</html>
